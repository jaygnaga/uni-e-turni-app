services:
  - type: web
    name: uni-e-turni
    runtime: static
    buildCommand: echo 'Static site ready'
    staticPublishPath: public
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
