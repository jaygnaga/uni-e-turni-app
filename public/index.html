function eventSort(a,b){return (a.date||'').localeCompare(b.date||'')||(a.start||'').localeCompare(b.start||'')||(a.title||'').localeCompare(b.title||'');}
function byId(id){return allEvents().find(e=>e.id===id)||null;}
function lecture(e){return e.type==='mandatory'||e.type==='elective';}
function isVisible(e){return data.filters[e.type]!==false && (e.type==='shift' || !ui.filterModule || (e.module||'')===ui.filterModule);}
function attendance(e){return data.attendance[e.id]||{status:'unset',hours:0};}
function effectiveHours(e){const a=attendance(e);const h=duration(e)||0;return a.status==='present'?h:a.status==='partial'?Math.max(0,Math.min(h,Number(a.hours)||0)):0;}
function setAttendance(id,status,hours){const e=byId(id);if(!e||!lecture(e))return;if(status==='unset')delete data.attendance[id];else data.attendance[id]={status,hours:status==='partial'?Math.max(0,Math.min(duration(e)||0,Number(hours)||0)):(status==='present'?duration(e)||0:0)};save();render();notify(status==='unset'?'Presenza riportata a “da segnare”.':'Registro presenze aggiornato.');}
function shiftFor(d){
 if(data.shifts[d]){const s=data.shifts[d];const code=String(s.code||'ALTRO').toUpperCase();const status=shiftRecordStatus(s);
 return {...s,status,id:'shift-'+d,date:d,title:'Turno '+code,type:'shift',start:shiftHours(code)[0],end:shiftHours(code)[1],endDate:code==='N'?addDays(d,1):null,simulated:false,tentative:status!=='confirmed'};}
 if(!data.projection || d<'2026-12-01'||d>'2027-06-30')return null;
 const base=dlocal('2026-12-01');const cur=dlocal(d);const idx=Math.round((cur-base)/86400000);const codes=['M','N','S','R','P'];const code=codes[((idx%5)+5)%5];return {id:'projection-'+d,date:d,title:'Turno teorico '+code,code,type:'shift',start:shiftHours(code)[0],end:shiftHours(code)[1],endDate:code==='N'?addDays(d,1):null,simulated:true,tentative:true};
}
// A compact always-visible turn badge. Recorded shifts override theoretical projections.
const SHIFT_LABELS={M:'Mattina',P:'Pomeriggio',N:'Notte',S:'Smonto',R:'Riposo',L:'Lunga',MREP:'Mattina + reperibilità',F:'Ferie',PERM:'Permesso',ALTRO:'Altro'};
const SHIFT_TIMES={M:'07–14',P:'13:10–20',N:'19:40–07',L:'07–17',MREP:'07–14'};
function shiftRecordStatus(s){return ['confirmed','pending','recorded'].includes(s?.status)?s.status:(s?.confirmed?'confirmed':'pending');}
function shiftStatus(date,shift){return !shift?'':!data.shifts[date]?'Teorico':shiftRecordStatus(data.shifts[date])==='confirmed'?'Confermato':shiftRecordStatus(data.shifts[date])==='pending'?'Da confermare':'Registrato';}
function shiftBadge(date,compact=false){
  if(data.filters.shift===false)return '';
  const shift=shiftFor(date);
  if(!shift)return '';
  const kind=shiftStatus(date,shift);
  const code=String(shift.code||'ALTRO').toUpperCase();
  const safeCode=/^(M|P|N|S|R|L|MREP|F|PERM|ALTRO)$/.test(code)?code:'ALTRO';
  const label=SHIFT_LABELS[safeCode]||'Altro';
  const hours=SHIFT_TIMES[safeCode]||'';
  const title=`${label}${hours?' · '+hours:''} · ${kind}${data.shifts[date]?.notes?' · '+data.shifts[date].notes:''}`;
  return `<button type="button" class="turn-pill turn-${safeCode.toLowerCase()} ${kind==='Teorico'?'theoretical':kind==='Confermato'?'confirmed':kind==='Da confermare'?'provisional':'recorded'} ${compact?'compact':''}" data-action="edit-shift" data-date="${html(date)}" title="${html(title)}" aria-label="${html(date)}: ${html(title)}"><span class="turn-letter">${html(code)}</span>${hours?`<span class="turn-hours">${html(hours)}</span>`:''}<span class="turn-state" aria-hidden="true">${kind==='Confermato'?'✓':kind==='Da confermare'?'?':kind==='Registrato'?'•':'~'}</span></button>`;
}

  <p class="turn-explainer">${loaded?'Tratteggiato = teorico. Puntinato arancione = da confermare. Ogni turno si modifica toccando la sigla.':'Non ci sono turni per queste date. Inseriscili nella sezione Turni o attiva la rotazione teorica.'}</p></section>`;

function shiftHours(code){return {M:['07:00','14:00'],P:['13:10','20:00'],N:['19:40','07:00'],L:['07:00','17:00'],MREP:['07:00','14:00'],S:[null,null],R:[null,null],F:[null,null],PERM:[null,null],ALTRO:[null,null]}[code]||[null,null];}
function eventsOn(d,filtered=true){let arr=allEvents().filter(e=>e.date===d && (!filtered||isVisible(e)));const s=shiftFor(d);if(s && (!filtered||isVisible(s)))arr.push(s);return arr.sort((a,b)=>(a.start||'').localeCompare(b.start||''));}
function dateSpan(month){const [y,m]=month.split('-').map(Number);const first=new Date(y,m-1,1);const firstOfGrid=new Date(y,m-1,1-(first.getDay()+6)%7);return Array.from({length:42},(_,i)=>iso(new Date(firstOfGrid.getFullYear(),firstOfGrid.getMonth(),firstOfGrid.getDate()+i)));}
function eventStamp(e,field){const d=(field==='end'&&e.endDate)||e.date;const clock=field==='end'?e.end:e.start;if(!d||!clock)return null;const [y,m,day]=d.split('-').map(Number);const [h,mm]=clock.split(':').map(Number);return new Date(y,m-1,day,h,mm).getTime();}
function calculateConflicts(){const list=allEvents().filter(e=>lecture(e)||e.type==='exam'||e.type==='custom');const dates=new Set(list.map(e=>e.date));Object.keys(data.shifts).forEach(x=>dates.add(x));if(data.projection)for(let d='2026-12-01';d<='2027-03-01';d=addDays(d,1))dates.add(d);
const shifts=[...dates].map(shiftFor).filter(Boolean).filter(e=>e.start && e.end);
const grouped=new Map();for(const e of list.concat(shifts)){if(e.start){const ar=grouped.get(e.date)||[];ar.push(e);grouped.set(e.date,ar);}}
const overlaps=[];
// Include overnight shifts by placing them also in next day for intersection.
for(const s of shifts.filter(x=>x.endDate)){const ar=grouped.get(s.endDate)||[];ar.push(s);grouped.set(s.endDate,ar);}
const seen=new Set();for(const [date,arr] of grouped){for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
const a=arr[i],b=arr[j];if(a.id===b.id)continue;if(a.type==='shift'&&b.type==='shift')continue;
// Only conflicts relevant to user; do not flag two electives on same date from distinct modules if simultaneous? still flag.
const key=[a.id,b.id].sort().join('|');if(seen.has(key))continue;
const sa=eventStamp(a,'start'),sb=eventStamp(b,'start'),ea=eventStamp(a,'end'),eb=eventStamp(b,'end');if(sa===null||sb===null)continue;
let kind=null,hours=null;
if(ea!==null && eb!==null){let overlap=Math.min(ea,eb)-Math.max(sa,sb);if(overlap>0){kind='overlap';hours=overlap/3600000;}}
else if(ea===null && eb!==null && sa>=sb && sa<eb)kind='unknown-exam-end';
else if(eb===null && ea!==null && sb>=sa && sb<ea)kind='unknown-exam-end';
if(kind){seen.add(key);overlaps.push({id:key,date:date,start:a.start,end:b.end,a,b,hours,kind,simulated:!!(a.simulated||b.simulated||a.tentative||b.tentative)});}
}}
return overlaps.sort((a,b)=>a.date.localeCompare(b.date));}
function moduleSummaries(){const rows=new Map();for(const e of allEvents().filter(lecture)){const key=e.module||e.course||e.title;if(!rows.has(key))rows.set(key,{module:key,course:e.course,title:e.title,type:e.type,total:0,present:0,absent:0,pending:0,marked:0,count:0,threshold:key==='71034'?.75:.6,events:[]});const r=rows.get(key);const h=duration(e)||0;const a=attendance(e);r.total+=h;r.present+=effectiveHours(e);r.count++;r.events.push(e);if(a.status==='unset'){r.pending+=h;}else{r.marked++;r.absent+=h-effectiveHours(e);}}
return [...rows.values()].sort((a,b)=>(a.type===b.type?0:a.type==='elective'?-1:1)||(a.course||'').localeCompare(b.course||'')||(a.module||'').localeCompare(b.module||''));}
function courseSummaries(){const rows=new Map();for(const r of moduleSummaries()){const key=r.course||r.module;let e=rows.get(key);if(!e){e={course:key,total:0,present:0,absent:0,pending:0,marked:0,count:0,modules:[],type:r.type};rows.set(key,e);}for(const k of ['total','present','absent','pending','marked','count'])e[k]+=r[k];e.modules.push(r);}return [...rows.values()].sort((a,b)=>(a.type===b.type?0:a.type==='elective'?-1:1)||(a.course||'').localeCompare(b.course||''));}

function moduleSummaryHTML(r){const pct=r.total?Math.round(r.present/r.total*1000)/10:0;const reach=r.present+r.pending>=r.total*r.threshold-.001;const minNeed=Math.max(0,r.total*r.threshold-r.present);return `<div class="module-detail"><div class="md-item"><div><div class="md-title">${html(r.title)}</div><div class="muted xs">${html(r.module)} · soglia ${Math.round(r.threshold*100)}% · ${r.count} lezioni</div></div>${r.marked?`<span class="tag ${reach?'good':'danger'}">${fmtHours(pct)}%</span>`:'<span class="tag pending">Non segnate</span>'}</div><div class="progress" style="margin:8px 0 5px"><span class="done" style="width:${r.total?100*r.present/r.total:0}%"></span><span class="missed" style="width:${r.total?100*r.absent/r.total:0}%"></span></div><div class="muted xs">${fmtHours(r.present)}/${fmtHours(r.total)} h presenti · ${fmtHours(r.pending)} h da segnare · servono ancora ${fmtHours(minNeed)} h</div><details style="margin-top:9px"><summary style="color:var(--blue);font-size:11px">Segna singole lezioni (${r.count}) ⌄</summary><div style="margin-top:7px">${r.events.sort(eventSort).map(e=>`<div class="md-item"><div>${html(niceDate(e.date,'short'))} ${html(e.start)} · ${fmtHours(duration(e))}h<br>${statusTag(e)}</div><div style="display:flex;gap:4px"><button class="mini-status present" title="Presente" data-action="mark" data-id="${html(e.id)}" data-status="present">✓</button><button class="mini-status absent" title="Assente" data-action="mark" data-id="${html(e.id)}" data-status="absent">✕</button><button class="mini-status" title="Modifica o presenza parziale" data-action="edit-event" data-id="${html(e.id)}">✎</button></div></div>`).join('')}</div></details></div>`;}
function renderAttendance(){const all=courseSummaries(),total=all.reduce((s,c)=>s+c.total,0),present=all.reduce((s,c)=>s+c.present,0),pending=all.reduce((s,c)=>s+c.pending,0);return `<div class="banner" style="margin-bottom:17px"><strong>Come vengono contate le presenze</strong><br>Una lezione non segnata resta <strong>da verificare</strong>, non assente. I calcoli mostrano il 60% generale, il 75% per il modulo 71034 e un riepilogo per ogni corso integrato. La regola formale di idoneità va sempre confermata con UNIBO.</div><div class="stat-grid" style="margin:0 0 19px"><div class="card stat"><div class="num">${fmtHours(total)} h</div><div class="name">Lezioni programmate</div></div><div class="card stat"><div class="num">${fmtHours(present)} h</div><div class="name">Presenti registrate</div></div><div class="card stat"><div class="num">${fmtHours(pending)} h</div><div class="name">Ancora da segnare</div></div><div class="card stat"><div class="num">${all.length}</div><div class="name">Corsi con orario disponibile</div></div></div><div class="course-list">${all.map(c=>{const pct=c.total?100*c.present/c.total:0;const missing=Math.max(0,c.total*.6-c.present);const permitted=Math.max(0,c.present+c.pending-c.total*.6);return `<div class="card course"><header><div><span class="course-code">${html(c.course)} · ${c.modules.length} moduli</span><h3>${html(courseTitle(c.course))}</h3></div><span class="tag ${c.type}">${c.type==='elective'?'A scelta':'Obbligatorio'}</span></header><div class="course-meta"><span class="chip">${fmtHours(c.total)} h previste</span><span class="chip">${fmtHours(c.present)} h presenti</span></div><div class="progress"><span class="done" style="width:${pct}%"></span><span class="missed" style="width:${c.total?100*c.absent/c.total:0}%"></span></div><div class="cinfo"><span>${c.marked?`${fmtHours(pct)}% registrato`:'Presenze ancora da registrare'}</span><span>${fmtHours(c.pending)} h non segnate</span></div><p class="footnote">Scenario 60% sul corso: servono altre ${fmtHours(missing)} h · margine teorico ${fmtHours(permitted)} h. Alcuni moduli possono avere soglie diverse.</p>${c.modules.map(moduleSummaryHTML).join('')}</div>`;}).join('')}</div><p class="footnote">Alcuni insegnamenti obbligatori non hanno ancora tutti gli orari disponibili e non sono inclusi nei totali orari. Tirocinio: obbligo di frequenza distinto.</p>`;}

${[...grouped].sort((a,b)=>a[0].localeCompare(b[0])).map(([date,list])=>{const confirmed=list.filter(c=>!c.simulated);const hr=confirmed.filter(c=>lecture(c.a)&&lecture(c.b)).reduce((sum,c)=>sum+(c.hours||0),0);return `<div class="card" style="margin-bottom:12px"><div class="section-title"><h3>${html(niceDate(date))}</h3><div><span class="tag ${confirmed.length?'danger':'pending'}">${hr?fmtHours(hr)+' ore tra lezioni':confirmed.length?'Sovrapposizione nota':'Solo previsione'}</span> <button class="btn sm" data-action="go-date" data-date="${date}">Vedi giorno</button></div></div>${list.map(c=>`<div class="conflict-pair"><div><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">${typeTag(c.a)} <strong>${html(c.a.title)}</strong></div><div class="muted xs" style="margin-top:2px">${tRange(c.a)}</div></div><div class="clash-mark">↕</div><div><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">${typeTag(c.b)} <strong>${html(c.b.title)}</strong></div><div class="muted xs" style="margin-top:2px">${tRange(c.b)}</div></div><div class="clash-hours">${c.kind==='unknown-exam-end'?'Inizio in sovrapposizione':(fmtHours(c.hours)+' h')}${c.simulated?'<br><small>Simulazione</small>':''}</div></div>`).join('')}</div>`;}).join('')||'<div class="empty-state">Non sono state trovate sovrapposizioni negli eventi attuali.</div>'}<p class="footnote">Lezioni e sedi possono cambiare. Verifica gli aggiornamenti UNIBO e aggiungi i turni ufficiali appena disponibili.</p>`;}

// Intelligent local import: conservative parser; every recognized shift must be reviewed before saving.
const MONTH_NUMBERS={gennaio:1,febbraio:2,marzo:3,aprile:4,maggio:5,giugno:6,luglio:7,agosto:8,settembre:9,ottobre:10,novembre:11,dicembre:12};
const CODE_ALIASES={M:'M',MATTINA:'M',P:'P',POMERIGGIO:'P',N:'N',NOTTE:'N',S:'S',SMONTO:'S',R:'R',RIPOSO:'R',L:'L',LUNGA:'L',F:'F',FERIE:'F',PERM:'PERM',PERMESSO:'PERM',MREP:'MREP',REPERIBILITA:'MREP',ALTRO:'ALTRO'};
function validDate(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;return iso(dlocal(d))===d;}
function normalizeShiftCode(raw){let x=String(raw||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'');return CODE_ALIASES[x]||null;}
function parseShiftText(raw,month){
const [defaultY,defaultM]=(month||'2026-11').split('-').map(Number);
const results=[],errors=[];const lines=String(raw||'').replace(/\r/g,'').split('\n');
const aliases='MREP|PERM|ALTRO|MATTINA|POMERIGGIO|NOTTE|SMONTO|RIPOSO|LUNGA|FERIE|PERMESSO|REPERIBILITÀ|REPERIBILITA|M|P|N|S|R|L|F';
const codePart=new RegExp('^\\s*[-:,;|\\s]*('+aliases+')(?![A-Za-zÀ-ÿ])','i');const datePart=/(?:\b\d{4}-\d{1,2}-\d{1,2}\b|\b\d{1,2}[\/.\-]\d{1,2}(?:[\/.\-]\d{2,4})?\b|\b\d{1,2}\s+(?:gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\b|\b\d{1,2}\b)/gi;
function dateFrom(x){let m=String(x).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);let y=defaultY,mo=defaultM,day=0;if(m){y=+m[1];mo=+m[2];day=+m[3];}else if(m=String(x).trim().match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/)){day=+m[1];mo=+m[2];if(m[3])y=+m[3]<100?2000+(+m[3]):(+m[3]);}else if(m=String(x).trim().match(/^(\d{1,2})\s+([A-Za-zÀ-ÿ]+)$/i)){day=+m[1];mo=MONTH_NUMBERS[m[2].toLowerCase()]||defaultM;}else if(/^\d{1,2}$/.test(String(x).trim()))day=+x;
const d=`${y}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;return validDate(d)?d:null;}
for(let n=0;n<lines.length;n++){
  const line=lines[n].trim();if(!line||/^(data|giorno|day|turno|codice|date|mese|orario|note)(\s|\||,|;|$)/i.test(line))continue;
  // Extract one or more (date, code) pairs from the line; never infer missing codes.
  const hits=[...line.matchAll(datePart)];let found=0;
  for(let i=0;i<hits.length;i++){
    const hit=hits[i];const after=line.slice(hit.index+hit[0].length,(hits[i+1]?.index)||line.length);
    const codeMatch=after.match(codePart);if(!codeMatch)continue;
    const date=dateFrom(hit[0]);const code=normalizeShiftCode(codeMatch[1]);if(!date||!code)continue;
    const notes=after.slice(codeMatch[0].length).replace(/^[,;:\s|–-]+/,'').trim();
    let status=/\b(confermat[oaie]|ufficiale)\b/i.test(notes)?'confirmed':/\b(attesa|richiest[oa]|provvisorio|confermare|cambio)\b/i.test(notes)?'pending':null;
    results.push({date,code,notes,status,sourceLine:n+1});found++;
  }
  if(!found && /\d/.test(line) && !/^\s*\/\//.test(line))errors.push({line:n+1,text:line.slice(0,110)});
}
const dedup=new Map();for(const row of results)dedup.set(row.date,row);return {rows:[...dedup.values()].sort((a,b)=>a.date.localeCompare(b.date)),errors,duplicates:results.length-dedup.size};
}

el.innerHTML=rows.length?`<div class="import-preview-head"><strong>2 · Verifica i ${rows.length} turni riconosciuti</strong><span class="chip">Nessuna modifica salvata</span></div><div class="import-preview-scroll"><table class="import-preview-table"><thead><tr><th>Data</th><th>Turno</th><th>Stato</th><th>Note</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><input aria-label="Data turno ${i+1}" type="date" name="importDate${i}" value="${html(r.date)}" required></td><td><select aria-label="Codice turno ${i+1}" name="importCode${i}">${Object.keys(SHIFT_LABELS).map(k=>`<option value="${k}" ${k===r.code?'selected':''}>${k}</option>`).join('')}</select></td><td><select aria-label="Stato turno ${i+1}" name="importStatus${i}">${[['pending','Da confermare'],['recorded','Registrato'],['confirmed','Confermato']].map(([k,v])=>`<option value="${k}" ${k===(r.status||ui.importDefaultStatus||'pending')?'selected':''}>${v}</option>`).join('')}</select></td><td><input aria-label="Note turno ${i+1}" name="importNotes${i}" value="${html(r.notes||'')}" placeholder="Facoltative"></td><td><button class="btn sm" type="button" data-action="remove-import-row" data-index="${i}" aria-label="Rimuovi riga ${i+1}">✕</button></td></tr>`).join('')}</tbody></table></div><label class="import-overwrite"><input type="checkbox" name="overwrite"> Sovrascrivi turni già registrati nelle stesse date (altrimenti li preservo)</label>`:'';
if(errors.length)el.innerHTML+=`<details class="import-warning" open><summary>⚠ ${errors.length} righe non riconosciute: controllale nel testo</summary><ul>${errors.slice(0,20).map(e=>`<li>Riga ${e.line}: ${html(e.text)}</li>`).join('')}</ul></details>`;
}
function readLocalShiftFile(file){const type=String(file?.type||'');const name=String(file?.name||'').toLowerCase();setAssistantStatus('Lettura di '+file.name+'…');
const finish=text=>{const el=document.getElementById('shift-bulk');if(el){el.value=String(text||'').trim();ui.importDraft=[];ui.importErrors=[];document.getElementById('shift-import-preview').innerHTML='';document.getElementById('save-import-shifts').disabled=true;setAssistantStatus('Testo estratto da '+file.name+'. Premi “Analizza i turni” e verifica il risultato.','success');}};
if(type.startsWith('image/')||/\.(png|jpg|jpeg|webp|bmp)$/.test(name)){loadShiftScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',()=>!!window.Tesseract).then(()=>window.Tesseract.recognize(file,'ita+eng',{logger:({status,progress})=>{if(status)setAssistantStatus('OCR: '+status+(progress?' · '+Math.round(progress*100)+'%':''));}})).then(result=>finish(result.data.text)).catch(()=>setAssistantStatus('Impossibile leggere la foto. Serve una connessione per il motore OCR; puoi incollare i turni come testo.','error'));return;}
if(type.includes('pdf')||name.endsWith('.pdf')){loadShiftScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',()=>!!window.pdfjsLib).then(async()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const pages=[];for(let p=1;p<=Math.min(10,pdf.numPages);p++){setAssistantStatus('Lettura PDF: pagina '+p+' di '+pdf.numPages);const content=await(await pdf.getPage(p)).getTextContent();let lastY=null,out='';for(const item of content.items){const y=Math.round(item.transform?.[5]||0);if(lastY!==null&&Math.abs(y-lastY)>3)out+='\n';else if(out)out+=' ';out+=item.str;lastY=y;}pages.push(out);}const extracted=pages.join('\n').trim();if(extracted.length>12){finish(extracted);return;}setAssistantStatus('Il PDF sembra una scansione; avvio OCR sulle prime pagine (serve internet per i modelli).');await loadShiftScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',()=>!!window.Tesseract);const scans=[];for(let i=1;i<=Math.min(5,pdf.numPages);i++){const page=await pdf.getPage(i);const viewport=page.getViewport({scale:1.65});const canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;const res=await window.Tesseract.recognize(canvas,'ita+eng');scans.push(res.data.text);}finish(scans.join('\n'));}).catch(()=>setAssistantStatus('Impossibile leggere il PDF qui. Prova con testo, CSV o uno screenshot.','error'));return;}
file.text().then(text=>{if(!name.endsWith('.ics')){finish(text);return;}const shifts=[];for(const block of text.split('BEGIN:VEVENT').slice(1)){const d=block.match(/DTSTART[^:\n]*:(\d{4})(\d{2})(\d{2})/i),sum=block.match(/SUMMARY[^:\n]*:([^\n]+)/i);if(!d||!sum)continue;const tokens=sum[1].replace(/\\,/g,',').match(/[A-Za-zÀ-ÿ]+/g)||[];const code=tokens.map(normalizeShiftCode).find(Boolean);if(code)shifts.push(`${d[1]}-${d[2]}-${d[3]} ${code} ${sum[1]}`);}finish(shifts.join('\n'));if(!shifts.length)setAssistantStatus('Nessun turno identificato nell’ICS. Puoi incollare il calendario come testo.','error');}).catch(()=>setAssistantStatus('Formato file non leggibile.','error'));
}

function downloadText(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function icsDate(d,t){return d.replace(/-/g,'')+'T'+(t||'00:00').replace(':','')+'00';}
function exportICS(){const events=allEvents().concat(Object.keys(data.shifts).map(shiftFor).filter(e=>e&&shiftStatus(e.date,e)==='Confermato'));let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Uni e Turni//Offline App//IT','CALSCALE:GREGORIAN','METHOD:PUBLISH'];for(const e of events){const d=e.date;if(!d||!e.start)continue;out.push('BEGIN:VEVENT','UID:'+icsEscape(e.id)+'@uni-e-turni','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace('Z','Z'),'DTSTART;TZID=Europe/Rome:'+icsDate(d,e.start));if(e.end)out.push('DTEND;TZID=Europe/Rome:'+icsDate(e.endDate||d,e.end));out.push('SUMMARY:'+icsEscape(e.title),'DESCRIPTION:'+icsEscape(e.notes||''));if(e.room)out.push('LOCATION:'+icsEscape(e.room));out.push('END:VEVENT');}out.push('END:VCALENDAR');downloadText('uni-e-turni-calendario-'+today()+'.ics',out.join('\r\n'),'text/calendar;charset=utf-8');notify('Calendario .ics esportato (senza turni simulati).');}

function commitShift(){
 const formEl=document.getElementById('shift-form');
 if(!formEl)return;
 const f=new FormData(formEl);
 const date=String(f.get('date')||'');
 const code=String(f.get('code')||'');
 const status=String(f.get('status')||'recorded');
 const notes=String(f.get('notes')||'');
 const errorEl=document.getElementById('shift-save-error');
 const warn=(msg)=>{if(errorEl){errorEl.textContent=msg;errorEl.style.display='block';}notify(msg);};
 if(!validDate(date)){warn('Inserisci una data valida per il turno.');return;}
 if(!Object.prototype.hasOwnProperty.call(SHIFT_LABELS,code)){warn('Scegli un tipo di turno valido.');return;}
 if(!['recorded','pending','confirmed'].includes(status)){warn('Scegli uno stato del turno valido.');return;}
 const originalDate=ui.modal?.date;
 if(originalDate&&date!==originalDate&&data.shifts[date]){
  if(!confirm('La data '+date+' ha già un turno registrato. Vuoi sostituirlo?'))return;
 }
 const previous=data.shifts;
 const next={...previous};
 if(originalDate&&originalDate!==date)delete next[originalDate];
 next[date]={...(next[date]||{}),code,status,confirmed:status==='confirmed',notes,origin:'manual-edit',editedAt:new Date().toISOString()};
 data.shifts=next;
 if(!save()){
  data.shifts=previous;
  warn('Non è stato possibile conservare questo cambio turno. Nessuna modifica è stata applicata. Controlla il salvataggio locale del browser o usa un backup JSON.');
  return;
 }
 ui.date=date;
 ui.month=date.slice(0,7);
 ui.shiftMonth=date.slice(0,7);
 clearModal();
 render();
 notify('✓ Turno del '+niceDate(date,'medium')+' salvato e verificato.');
}

if(act==='export-ics'){exportICS();return;}
if(act==='reset-events'){if(!confirm('Ripristinare gli eventi UNIBO iniziali? Presenze e turni resteranno invariati.'))return;data.patches={};data.deletedIds=[];save();render();notify('Eventi originali ripristinati.');return;}
if(act==='reset-all'){if(!confirm('Cancellare tutte le modifiche e i dati salvati in questo browser?'))return;data=DEFAULT_STATE();save();render();notify('Dati locali cancellati.');return;}}
function handleSubmit(ev){if(ev.target.getAttribute('id')==='shift-bulk-form'){
 ev.preventDefault();const form=new FormData(ev.target);const draft=ui.importDraft||[];
 if(!draft.length){notify('Prima analizza il testo o il file.');return;}
 const rows=[],dates=new Set();for(let i=0;i<draft.length;i++){
 const date=String(form.get('importDate'+i)||''),code=String(form.get('importCode'+i)||''),status=String(form.get('importStatus'+i)||'pending'),notes=String(form.get('importNotes'+i)||'').trim();
 if(!validDate(date)||!SHIFT_LABELS[code]||!['pending','recorded','confirmed'].includes(status)){notify('Controlla la riga '+(i+1));return;}
 if(dates.has(date)){notify('Data duplicata nella revisione: '+date);return;}dates.add(date);rows.push({date,code,status,confirmed:status==='confirmed',notes});
 }
 const overwrite=form.get('overwrite')==='on';const exists=rows.filter(r=>data.shifts[r.date]);const imported=rows.filter(r=>overwrite||!data.shifts[r.date]);
 if(!imported.length){notify('Tutte le date sono già registrate. Abilita la sovrascrittura solo se vuoi modificarle.');return;}
 if(!confirm(`Salvare ${imported.length} turni? ${exists.length&&!overwrite?exists.length+' turni già presenti resteranno invariati.':overwrite&&exists.length?exists.length+' turni esistenti verranno sovrascritti.':''}`))return;
 const previousShifts=data.shifts;const nextShifts={...previousShifts};
 for(const row of imported)nextShifts[row.date]={...nextShifts[row.date],code:row.code,status:row.status,confirmed:row.confirmed,notes:row.notes,origin:'assistant-import'};
 data.shifts=nextShifts;
 if(!save()){data.shifts=previousShifts;notify('Importazione non salvata: il browser non conserva le modifiche. Nessun turno è stato cambiato.');return;}clearModal();render();notify(imported.length+' turni salvati e verificati; restano modificabili.');return;}
if(ev.target.getAttribute('id')==='shift-form'){ev.preventDefault();commitShift();return;}
if(ev.target.getAttribute('id')==='event-form'){ev.preventDefault();const f=new FormData(ev.target);const id=String(f.get('id')||''),type=String(f.get('type')),date=String(f.get('date')),start=String(f.get('start')),end=String(f.get('end')||'');if(!date||!start||!String(f.get('title')).trim()){notify('Compila nome, data e ora.');return;}if(end && min(end)<=min(start)){notify('L’ora di fine deve essere successiva all’inizio.');return;}if((type==='mandatory'||type==='elective')&&!end){notify('Per le lezioni inserisci anche l’ora di fine.');return;}
const next={date,start,end:end||null,type,title:String(f.get('title')||'').trim(),module:String(f.get('module')||'').trim(),room:String(f.get('room')||'').trim(),notes:String(f.get('notes')||'').trim(),booking:String(f.get('booking')||'unknown')};
if(id&&byId(id)){if(id.startsWith('custom-')){const ix=data.customEvents.findIndex(e=>e.id===id);if(ix>=0)data.customEvents[ix]={...data.customEvents[ix],...next};}else data.patches[id]={...(data.patches[id]||{}),...next};}
else {const newId='custom-'+Date.now()+'-'+Math.floor(Math.random()*1e5);data.customEvents.push({id:newId,...next,course:next.module||'',verified:false});}
if(id&&lecture(byId(id))){const status=f.get('attendanceStatus')||'unset';if(status==='unset')delete data.attendance[id];else data.attendance[id]={status,hours:status==='present'?Math.max(0,Number(duration(byId(id)))||0):status==='partial'?Number(f.get('partialHours'))||0:0};}
save();clearModal();render();notify('Impegno salvato.');return;}}
function handleChange(ev){if(ev.target.id==='shift-upload'){const f=ev.target.files?.[0];if(f)readLocalShiftFile(f);return;}
if(ev.target.id==='event-type'){const isExam=ev.target.value==='exam';document.getElementById('booking-field').hidden=!isExam;const status=document.getElementById('attendance-field');if(status)status.hidden=(isExam||ev.target.value==='custom'||!ui.modal?.id);}
if(ev.target.id==='event-attendance'){document.getElementById('partial-field').hidden=ev.target.value!=='partial';}
if(ev.target.id==='module-filter'){ui.filterModule=ev.target.value||null;render();return;}
if(ev.target.id==='backup-file'){const file=ev.target.files?.[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const obj=JSON.parse(rd.result);if(obj.app!=='Uni & Turni'||!obj.state||!Array.isArray(obj.state.customEvents)||!obj.state.patches||!obj.state.attendance||!obj.state.shifts)throw new Error('Formato non riconosciuto');if(!confirm('Importare il backup? Sostituirà tutte le modifiche locali.'))return;data=Object.assign(DEFAULT_STATE(),obj.state);if(!obj.state.novemberImported){for(const [d,turn] of Object.entries(NOVEMBER_SHIFTS)){if(!Object.prototype.hasOwnProperty.call(data.shifts,d))data.shifts[d]={...turn};}data.novemberImported=true;}save();render();notify('Backup importato, turni di novembre preservati.');}catch(err){notify('Impossibile importare il file: formato non valido.');}};rd.readAsText(file);ev.target.value='';}}
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('change',handleChange);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)clearModal();if((e.key==='Enter'||e.key===' ')&&e.target.dataset?.action==='select-date'){e.preventDefault();ui.date=e.target.dataset.date;ui.month=ui.date.slice(0,7);render();}});
render();
</script><script>if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
